name: Build, Test & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# دسترسی پیش‌فرض فقط‌خواندنی؛ فقط job انتشار اجازه نوشتن دارد
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "versionName in build.gradle.kts: $VERSION_NAME"
          echo "git tag: $GITHUB_REF_NAME"
          if [ "v$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME. Update app/build.gradle.kts (versionName and versionCode) before tagging."
            exit 1
          fi

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zarb-release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/zarb-release.keystore" >> "$GITHUB_ENV"
            echo "Signing key found."
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. A tagged release must be signed with the release key. See RELEASING.md."
            exit 1
          else
            echo "::warning::No signing key. This build is signed with the temporary debug key and must NOT be distributed."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify and Rename APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "ERROR: $APK was not found!"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          cp "$APK" Jadval_Zarb.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs Jadval_Zarb.apk
          fi
          ls -lh Jadval_Zarb.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jadval_Zarb-apk
          path: Jadval_Zarb.apk
          retention-days: 14

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Room Schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Jadval_Zarb-apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Jadval_Zarb.apk
          name: "نسخه ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
